name: Monthly Grades Report

on:
  schedule:
    - cron: '0 6 1 * *'  # ב-1 לכל חודש בשעה 06:00 UTC (09:00 ישראל)
  workflow_dispatch:      # אפשרות להרצה ידנית לבדיקות

jobs:
  generate-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests openpyxl

      - name: Generate and send grades report
        env:
          AIRTABLE_API_TOKEN: ${{ secrets.AIRTABLE_API_TOKEN }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python scripts/generate_grades_report.py
